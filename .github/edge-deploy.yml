# .github/workflows/edge-deploy.yml

name: Build, Test e Deploy — Edge AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yolo-api

jobs:
  # ── JOB 1: Testes unitários ───────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r app/requirements.txt pytest ruff

      - run: ruff check app/

      - run: pytest tests/ -v

  # ── JOB 2: Build multi-arch e push ───────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        # emulação ARM64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Quality gate do modelo ────────────────────────
  model-gate:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install dvc ultralytics

      - run: dvc pull

      - run: python scripts/validate_model.py

  # ── JOB 4: Deploy no Raspberry Pi ────────────────────────
  deploy:
    needs: model-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/yolo-api
            docker compose pull
            docker compose up -d
            sleep 10
            curl -f http://localhost:8000/health || \
              (docker compose down && \
               docker compose up -d --scale yolo-api=0 && \
               exit 1)
